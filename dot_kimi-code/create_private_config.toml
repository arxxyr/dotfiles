# ~/.kimi-code/config.toml — Kimi Code CLI 运行时配置
#
# chezmoi 用 create_ 前缀纳管：只在目标文件缺失时铺一份种子，之后永不覆盖。
# 原因：这个文件 CLI 自己会写——启动时从服务端刷新模型目录、/model 切换会持久化
# default_model、版本升级会跑配置迁移（0.38 就把 thinking.effort 的 max 改成了 high）。
# 静态纳管必然天天打架，所以这里只负责新机器 bootstrap。
#
# 常驻偏好不要指望这个文件：模型 / 思考档 / 权限模式都由 cc-kimi 在启动时钉死。
# 改完想同步回仓库：chezmoi re-add ~/.kimi-code/config.toml
#
# 凭据不在这里：OAuth 令牌落在 ~/.kimi-code/credentials 与 ~/.kimi-code/oauth，
# 两者都不纳管（本仓库是公开仓库）。api_key 留空即走 OAuth。

default_model = "kimi-code/k3"

[providers."managed:kimi-code"]
type = "kimi"
api_key = ""
base_url = "https://api.kimi.com/coding/v1"

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[models."kimi-code/kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K2.7 Coding"

[models."kimi-code/kimi-for-coding-highspeed"]
provider = "managed:kimi-code"
model = "kimi-for-coding-highspeed"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K2.7 Coding Highspeed"

[models."kimi-code/k3"]
provider = "managed:kimi-code"
model = "k3"
max_context_size = 1048576
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K3"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[models."kimi-code/k3-256k"]
provider = "managed:kimi-code"
model = "k3-256k"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "tool_use" ]
display_name = "K3-256k"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[thinking]
enabled = true
# 基线思考档。cc-kimi 另外用 KIMI_MODEL_THINKING_EFFORT 在出网请求上强制 max：
# 这里这行只管状态栏/会话 profile 显示（不写它状态栏会显示 K3 的出厂 default_effort=high，
# 与实际发出去的 max 对不上）。两层都留着——新机器首启会跑 thinking-effort-max-to-high
# 迁移把这行改回 high，那时 env 那层仍然保证请求是 max。
effort = "max"

[services.moonshot_search]
base_url = "https://api.kimi.com/coding/v1/search"
api_key = ""

[services.moonshot_search.oauth]
storage = "file"
key = "oauth/kimi-code"

[services.moonshot_fetch]
base_url = "https://api.kimi.com/coding/v1/fetch"
api_key = ""

[services.moonshot_fetch.oauth]
storage = "file"
key = "oauth/kimi-code"

