# chezmoi 模板数据：跨模板复用的机器/环境变量
# 改这里一处，所有引用 {{ .proxy.* }} 的模板自动跟随，避免逐文件改硬编码

[proxy]
# 本机代理地址：macOS/Windows 为 xray 本地 mixed 入站，127.0.0.1 直用；
# Linux 网关地址走 $(proxy_host) 动态获取，仅与本机共用端口
host = "127.0.0.1"
port = 10808

[kimi]
# Kimi Code CLI 的模型与思考档：cc-kimi 的启动参数、config.toml 的强制项共用这一处。
# 改这里一处，脚本与配置一起跟随，避免两边各写一份再对不上（正是"显示 high / 实际 max"那次的根因）。
model = "kimi-code/k3"
effort = "max"

[codex]
# Codex CLI 的模型与推理档，以及需要跨机同步的受信项目。
# 受信项目写成相对 $HOME 的路径，模板渲染时拼上本机 homeDir——
# 原来源文件里 /home/loosqk 与 /Users/loosqk 两套路径混在一起，就是各机 re-add 攒出来的。
model = "gpt-5.6-sol"
effort = "ultra"
# 项目级指令回退：仓库只有 CLAUDE.md 没有 AGENTS.md 时（robot/ 下就有三个），
# codex 默认一份都不读，而 Claude Code 照读不误。语义是回退不是叠加：
# AGENTS.md 在就用它，缺了才读 CLAUDE.md，不会重复。
doc_fallback_filenames = ["CLAUDE.md"]
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "run-state", "current-dir", "five-hour-limit", "weekly-limit", "context-window-size", "used-tokens", "fast-mode", "task-progress"]
trusted_projects = ["repo/robot/robot-system", ".openclaw", "Documents/bp", "repo/docs/面试"]
